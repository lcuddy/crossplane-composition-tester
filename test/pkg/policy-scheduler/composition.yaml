apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xpolicyscheduler.aws.example.com
spec:
  compositeTypeRef:
    apiVersion: policyscheduler.example.com/v1alpha1
    kind: XPolicyScheduler
  mode: Pipeline
  pipeline:
  - step: environmentConfigs
    functionRef:
      name: function-environment-configs
    input:
      apiVersion: environmentconfigs.fn.crossplane.io/v1beta1
      kind: Input
      spec:
        environmentConfigs:
        - type: Reference
          ref:
            name: envconfig
  - functionRef:
      name: function-go-templating
    step: roles-and-policies-schedule
    input:
      apiVersion: gotemplating.fn.crossplane.io/v1beta1
      kind: GoTemplate
      source: Inline
      inline:
        template: |-
          {{- range .observed.composite.resource.spec.schedules }}
          {{/* process each schedule entry */}}
          {{- if and .scheduleFrom .scheduleUntil .roleName .policyArn }}
          
            {{- $scheduleFrom := .scheduleFrom }}
            {{- $scheduleUntil := .scheduleUntil }}
            {{- $roleName := .roleName }}
            {{- $policyArn := .policyArn }}
            {{- $currentTime := now }}

            {{/* Ensure policy assignment only within the schedule window */}}
            {{- if and (ge $currentTime $scheduleFrom) (le $currentTime $scheduleUntil) }}
            ---
            apiVersion: iam.aws.crossplane.io/v1beta1
            kind: Role
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: role
              name: {{$roleName}}
            spec:
              forProvider:
                assumeRolePolicyDocument: |
                  {
                    "Version": "2012-10-17",
                    "Statement": [
                      {
                        "Effect": "Allow",
                        "Principal": {
                          "Service": "ec2.amazonaws.com"
                        },
                        "Action": "sts:AssumeRole"
                      }
                    ]
                  }
              providerConfigRef:
                name: providerconfig-aws
            {{- end }}

            {{/* Attach the policies after the role is ready */}}

            {{ if and (ne .observed.resources nil) (ne ( index .observed.resources "role" ) nil) }}
            {{ if eq (.observed.resources.role | getResourceCondition "Ready").Status "True" }}
            ---
            apiVersion: iam.aws.crossplane.io/v1beta1
            kind: RolePolicyAttachment
            metadata:
              name: {{$roleName}}-policy
            spec:
              forProvider:
                roleName: {{$roleName}}
                policyArn: {{$policyArn}}
              providerConfigRef:
                name: providerconfig-aws
            {{- end }}
            {{- end }}

          {{- end }}
          {{- end }}
  - step: automatically-detect-ready-composed-resources
    functionRef:
      name: function-auto-ready
